name: OpenRouter PR Review

on:
  workflow_call:
    inputs:
      models:
        description: Comma-separated OpenRouter review-lane slugs (cap 4).
        type: string
        default: x-ai/grok-4.6
      model_routes:
        description: Trusted JSON per-model provider and service_tier overrides; review lanes only.
        type: string
        default: ""
      judge_model:
        description: OpenRouter judge slug. Used when judging is enabled.
        type: string
        default: openai/gpt-5.6-luna
      github_token:
        type: string
        default: ${{ github.token }}
      github_timeout_seconds:
        description: Timeout in seconds for GitHub CLI and local-git diff operations (1-600).
        type: string
        default: "120"
      openrouter_timeout_seconds:
        description: Timeout in seconds for each OpenRouter request (1-600).
        type: string
        default: "180"
      job_budget_seconds:
        description: Total action budget in seconds, measured from Python startup.
        type: string
        default: "1320"
      all_role_deadline_seconds:
        description: Optional wall-clock cap for concurrent role=all lanes; empty derives it.
        type: string
        default: ""
      pr_number:
        type: string
        default: ""
      fail_on:
        type: string
        default: never
      roast_level:
        type: string
        default: professional
      custom_instructions:
        type: string
        default: ""
      path_profiles:
        type: string
        default: ""
      generated_paths:
        description: >-
          Extra path globs (JSON array) treated as generated/vendored during
          diff-budget triage. Trusted workflow configuration only.
        type: string
        default: ""
      status_comments:
        type: string
        default: "true"
      max_diff_kb:
        type: string
        default: "300"
      review_scope:
        type: string
        default: full-pr
      review_mode:
        type: string
        default: auto
      effort:
        type: string
        default: ""
      max_tool_turns:
        description: >-
          Read-only tool rounds (default 50, sibling first-pass max_turns).
          Follow-up callers often pass 30. 0 disables tools.
        type: string
        default: "50"
      bot_login:
        description: >-
          GitHub login the reviews post as. Review-loop ledger state is only
          trusted from this identity; set it when github_token is a PAT or
          GitHub App token.
        type: string
        default: "github-actions[bot]"
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      models_json: ${{ steps.parse.outputs.models_json }}
      lane_count: ${{ steps.parse.outputs.lane_count }}
      judge_needed: ${{ steps.parse.outputs.judge_needed }}
      judge_model: ${{ steps.parse.outputs.judge_model }}
      reviewed_sha: ${{ steps.reviewed-head.outputs.sha }}
    steps:
      - name: Resolve reviewed PR head
        id: reviewed-head
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPLICIT_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ inputs.github_token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${EXPLICIT_PR_NUMBER:-${EVENT_PR_NUMBER:-}}"
          if [[ ! "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must identify a pull request."
            exit 1
          fi
          # An explicit PR number may name a PR other than the triggering
          # event. Resolve its head from the API instead of mixing identities.
          SHA=""
          if [ -z "${EXPLICIT_PR_NUMBER:-}" ] || \
             [ "$EXPLICIT_PR_NUMBER" = "${EVENT_PR_NUMBER:-}" ]; then
            SHA="${EVENT_HEAD_SHA:-}"
          fi
          if [ -z "$SHA" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve a full PR head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          echo "sha=${SHA,,}" >> "$GITHUB_OUTPUT"
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyOverCoderKY/openrouter-pr-review-action
          # github.workflow_sha is the *caller* workflow commit. This job must
          # check out the reusable workflow's own commit.
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false
      - id: parse
        uses: ./
        with:
          role: setup
          models: ${{ inputs.models }}
          model_routes: ${{ inputs.model_routes }}
          judge_model: ${{ inputs.judge_model }}
          github_timeout_seconds: ${{ inputs.github_timeout_seconds }}
          openrouter_timeout_seconds: ${{ inputs.openrouter_timeout_seconds }}
          job_budget_seconds: ${{ inputs.job_budget_seconds }}
          all_role_deadline_seconds: ${{ inputs.all_role_deadline_seconds }}
          fail_on: ${{ inputs.fail_on }}
          roast_level: ${{ inputs.roast_level }}
          review_scope: ${{ inputs.review_scope }}
          review_mode: ${{ inputs.review_mode }}
          max_diff_kb: ${{ inputs.max_diff_kb }}
          max_tool_turns: ${{ inputs.max_tool_turns }}
          custom_instructions: ${{ inputs.custom_instructions }}
          path_profiles: ${{ inputs.path_profiles }}
          generated_paths: ${{ inputs.generated_paths }}

  lane:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.reviewed_sha }}
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyOverCoderKY/openrouter-pr-review-action
          ref: ${{ github.job_workflow_sha }}
          path: .or-pr-review-action
          persist-credentials: false
      - id: lane
        uses: ./.or-pr-review-action
        with:
          role: lane
          models: ${{ matrix.model }}
          model_routes: ${{ inputs.model_routes }}
          lane_index: ${{ matrix.index }}
          judge_needed: ${{ needs.setup.outputs.judge_needed }}
          judge_model: ${{ inputs.judge_model }}
          github_token: ${{ inputs.github_token }}
          github_timeout_seconds: ${{ inputs.github_timeout_seconds }}
          openrouter_timeout_seconds: ${{ inputs.openrouter_timeout_seconds }}
          job_budget_seconds: ${{ inputs.job_budget_seconds }}
          all_role_deadline_seconds: ${{ inputs.all_role_deadline_seconds }}
          pr_number: ${{ inputs.pr_number }}
          head_sha: ${{ needs.setup.outputs.reviewed_sha }}
          fail_on: ${{ inputs.fail_on }}
          roast_level: ${{ inputs.roast_level }}
          custom_instructions: ${{ inputs.custom_instructions }}
          path_profiles: ${{ inputs.path_profiles }}
          generated_paths: ${{ inputs.generated_paths }}
          status_comments: ${{ inputs.status_comments }}
          max_diff_kb: ${{ inputs.max_diff_kb }}
          review_scope: ${{ inputs.review_scope }}
          review_mode: ${{ inputs.review_mode }}
          effort: ${{ inputs.effort }}
          max_tool_turns: ${{ inputs.max_tool_turns }}
          bot_login: ${{ inputs.bot_login }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload lane artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-${{ matrix.index }}
          path: ${{ steps.lane.outputs.lane_file }}
          if-no-files-found: warn

  judge:
    needs: [setup, lane]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.judge_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.reviewed_sha }}
      - name: Checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyOverCoderKY/openrouter-pr-review-action
          ref: ${{ github.job_workflow_sha }}
          path: .or-pr-review-action
          persist-credentials: false
      - name: Download lane artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/or-pr-review-lanes
          pattern: lane-*
          merge-multiple: true
      - uses: ./.or-pr-review-action
        with:
          role: judge
          models: ${{ inputs.models }}
          model_routes: ${{ inputs.model_routes }}
          judge_model: ${{ inputs.judge_model }}
          judge_needed: "true"
          lane_results_dir: ${{ runner.temp }}/or-pr-review-lanes
          github_token: ${{ inputs.github_token }}
          github_timeout_seconds: ${{ inputs.github_timeout_seconds }}
          openrouter_timeout_seconds: ${{ inputs.openrouter_timeout_seconds }}
          job_budget_seconds: ${{ inputs.job_budget_seconds }}
          all_role_deadline_seconds: ${{ inputs.all_role_deadline_seconds }}
          pr_number: ${{ inputs.pr_number }}
          head_sha: ${{ needs.setup.outputs.reviewed_sha }}
          fail_on: ${{ inputs.fail_on }}
          roast_level: ${{ inputs.roast_level }}
          custom_instructions: ${{ inputs.custom_instructions }}
          path_profiles: ${{ inputs.path_profiles }}
          generated_paths: ${{ inputs.generated_paths }}
          status_comments: ${{ inputs.status_comments }}
          max_diff_kb: ${{ inputs.max_diff_kb }}
          review_scope: ${{ inputs.review_scope }}
          review_mode: ${{ inputs.review_mode }}
          bot_login: ${{ inputs.bot_login }}
          max_tool_turns: ${{ inputs.max_tool_turns }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
