# The review workflow and action come from the trusted base; PR source stays inert.
# PR-head code is exercised separately by the read-only CI job without secrets.
# A skipped follow-up means the loop has not been seeded; dispatch a first pass.
# Advisory only: fail_on is never and this must not become a required check.
name: Self review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  first-pass:
    name: Self review first-pass
    # Keep the existing owner-actor gate for paid review runs.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        (github.event.action == 'opened' ||
         github.event.action == 'reopened' ||
         github.event.action == 'ready_for_review')))
    concurrency:
      group: self-review-first-pass-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require OPENROUTER_API_KEY
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::error::OPENROUTER_API_KEY is empty (fork PRs do not receive repository secrets)."
          exit 1

      - name: Resolve PR head SHA
        id: head
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="${EVENT_HEAD_SHA:-}"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve PR head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          BASE_SHA="${EVENT_BASE_SHA:-}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          fi
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.head.outputs.sha }}

      - name: Checkout trusted action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.head.outputs.base_sha }}
          path: .or-pr-review-action

      - name: Run self review (trusted harness)
        uses: ./.or-pr-review-action
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          models: openai/gpt-6.1-sol
          review_scope: full-pr
          review_mode: auto
          effort: medium
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: "1024"
          max_tool_turns: "50"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  follow-up:
    name: Self review follow-up
    if: >-
      github.actor == github.repository_owner &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.action == 'synchronize'
    concurrency:
      group: self-review-follow-up-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require OPENROUTER_API_KEY
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::error::OPENROUTER_API_KEY is empty (fork PRs do not receive repository secrets)."
          exit 1

      # Ledger-based gating, ported from the org reusable: a synchronize that
      # outruns the first-pass (or lands while it is mid-flight, so its review
      # posts stale/partial and never seeds) SKIPS with a notice instead of
      # failing red. Seed with workflow_dispatch (pr_number). The per-page
      # count + awk sum drains pagination so pipefail can never SIGPIPE gh.
      - name: Require a seeded review loop
        id: seeded
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if ! matches="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- openrouter-review-ledger:v1:")))] | length' \
              | awk '{sum += $1} END {print sum + 0}')"; then
            echo "::warning::Could not list PR reviews for the ledger check; skipping the follow-up without spend. Re-run or dispatch a first-pass."
            exit 0
          fi
          if [ "${matches:-0}" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Review-loop ledger found; running the verify round."
          else
            echo "::notice::Skipping the self-review follow-up: no review-loop ledger on this PR yet (first-pass still running or never seeded). Dispatch the Self review workflow with this pr_number to seed. No OpenRouter spend."
          fi

      - name: Checkout PR head
        if: steps.seeded.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout trusted action
        if: steps.seeded.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .or-pr-review-action

      - name: Run self review follow-up (verify round)
        if: steps.seeded.outputs.ready == 'true'
        uses: ./.or-pr-review-action
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number }}
          models: openai/gpt-6.1-sol
          review_scope: latest-commit
          review_mode: auto
          effort: low
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: "1024"
          max_tool_turns: "30"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
